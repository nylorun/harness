# Proposed until phase-0 freeze with Runtime team. Expect iteration as Cloud service develops.
# Mirrors docs/agents-api-wire-spec.md. Not a stable contract.
openapi: 3.1.0
info:
  title: Nylorun Agents API (Cloud v1.0)
  version: 0.0.0-proposed
  description: |
    Public HTTP/SSE/executor surfaces for `@nylorun/runtime` against Nylorun Cloud.
    Source: agents-api-wire-spec.md. All paths and JSON are proposed until phase-0 freeze.
servers:
  - url: https://{project}.nylorun.app
    variables:
      project:
        default: example
security:
  - ServerKey: []
  - EndUserJWT: []
  - ExecutorCredential: []
tags:
  - name: Agents
  - name: Sessions
  - name: Stream
  - name: Executor
  - name: Admin
paths:
  /v1/agents/{id}:
    put:
      tags: [Agents]
      summary: Register agent manifest
      description: Server key only. JWT cannot publish agents.
      security:
        - ServerKey: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: Manifest registered (response shape unfrozen)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/sessions/{id}:
    put:
      tags: [Sessions]
      summary: Open or create session
      description: Immutable owner and pinned harness/manifest versions at creation.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionRequest'
      responses:
        '200':
          description: Session opened (response shape unfrozen)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/sessions/{id}/events:
    post:
      tags: [Sessions]
      summary: Submit command (message, cancel, answer, action_result)
      description: |
        Message while busy → 409 session_busy (steering deferred).
        Approval, answer, cancel, action_result permitted while busy with auth.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCommand'
      responses:
        '200':
          description: Accepted or rejected command outcome
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommandAccepted'
                  - $ref: '#/components/schemas/CommandRejected'
        '409':
          description: session_busy or runtime_retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRejected'
    get:
      tags: [Stream]
      summary: Resumable SSE event stream
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor; stream resumes at the following event index
      responses:
        '200':
          description: text/event-stream of session events
          content:
            text/event-stream:
              schema:
                type: string
        '410':
          description: cursor_expired — re-fetch history

  /v1/sessions/{id}/items:
    get:
      tags: [Sessions]
      summary: Saved history with stream handoff cursor
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Snapshot items plus cursor for stream({ after })
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'

  /v1/sessions/{id}/actions:
    get:
      tags: [Executor]
      summary: List authorized pending actions
      security:
        - ExecutorCredential: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Pending actions for executor scope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/sessions/{id}/export:
    get:
      tags: [Sessions]
      summary: Versioned export of saved records (no secrets)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Export document (schema unfrozen beyond purpose)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/actions/{id}/claim:
    post:
      tags: [Executor]
      summary: Atomically claim one action
      security:
        - ExecutorCredential: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimActionRequest'
      responses:
        '200':
          description: Lease generation, token, deadline
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/actions/{id}/heartbeat:
    post:
      tags: [Executor]
      summary: Extend current lease (must match generation)
      security:
        - ExecutorCredential: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Lease extended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/executors/connect:
    get:
      tags: [Executor]
      summary: Upgrade to authenticated executor WebSocket
      security:
        - ExecutorCredential: []
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '200':
          description: Non-upgrade response (unfrozen)

  /v1/admin/{adminPath}:
    get:
      tags: [Admin]
      summary: Admin configuration, usage, keys, claims, health
      description: Exact Admin path tree unfrozen. Console/service audience.
      parameters:
        - name: adminPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Admin response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Admin]
      summary: Admin mutation
      parameters:
        - name: adminPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Admin response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    ServerKey:
      type: http
      scheme: bearer
      description: Project/environment secret key (nyl_sk_…)
    EndUserJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT from project-configured issuer
    ExecutorCredential:
      type: http
      scheme: bearer
      description: Scoped executor credential

  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    RegisterAgentRequest:
      type: object
      required: [requestId, manifest]
      properties:
        requestId:
          type: string
        manifest:
          type: object
          description: Agent JSON manifest (harness shape)
          additionalProperties: true

    OpenSessionRequest:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
        agentId:
          type: string
        user:
          type: object
          description: Trusted with server key; from JWT claims for browser
          additionalProperties: true
        state:
          type: object
          additionalProperties: true

    SessionCommand:
      oneOf:
        - $ref: '#/components/schemas/MessageCommand'
        - $ref: '#/components/schemas/CancelCommand'
        - $ref: '#/components/schemas/AnswerCommand'
        - $ref: '#/components/schemas/ActionResultCommand'
      discriminator:
        propertyName: type

    MessageCommand:
      type: object
      required: [requestId, type, text]
      properties:
        requestId:
          type: string
        idempotencyKey:
          type: string
        type:
          type: string
          const: message
        text:
          type: string

    CancelCommand:
      type: object
      required: [requestId, type]
      properties:
        requestId:
          type: string
        idempotencyKey:
          type: string
        type:
          type: string
          const: cancel

    AnswerCommand:
      type: object
      required: [requestId, type, interactionId]
      properties:
        requestId:
          type: string
        idempotencyKey:
          type: string
        type:
          type: string
          const: answer
        interactionId:
          type: string
        value: {}

    ActionResultCommand:
      type: object
      required: [requestId, type, actionId, callId]
      properties:
        requestId:
          type: string
        idempotencyKey:
          type: string
        type:
          type: string
          const: action_result
        actionId:
          type: string
        callId:
          type: string
        leaseGeneration:
          type: integer
        executorCodeVersion:
          type: string
        success:
          type: boolean
        output: {}

    CommandAccepted:
      type: object
      required: [status, turnId, cursor, requestId]
      properties:
        status:
          type: string
          const: accepted
        turnId:
          type: string
        cursor:
          type: string
          description: Opaque session+index; may precede S2 publication
        requestId:
          type: string

    CommandRejected:
      type: object
      required: [status, code]
      properties:
        status:
          type: string
          const: rejected
        code:
          type: string
          description: e.g. session_busy, runtime_retired, cursor_expired, validation…
          examples: [session_busy, runtime_retired]
        turnId:
          type: string
        message:
          type: string
        requestId:
          type: string

    HistoryResponse:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        cursor:
          type: string
          description: Handoff cursor for GET .../events?after=

    ClaimActionRequest:
      type: object
      properties:
        requestId:
          type: string
        executorCodeVersion:
          type: string
