name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check --workspace @nylorun/harness
      - run: npm ci --prefix examples
      - run: npm run check --prefix examples
      - run: npm test --prefix examples
      - run: npm run check --workspace @nylorun/studio
