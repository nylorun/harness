name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Full suite on the pinned toolchain. Includes test:tooling, i.e. the Linux
  # leg of the desktop-contract and supervisor tests (see `desktop`).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - run: npm run check -- --built
      - run: npm run check:stack -- --built
  # End-to-end, in parallel with `check`: packed starter in a real browser,
  # dev supervisor, clean-checkout setup, and the release combination.
  smoke:
    runs-on: ubuntu-latest
    # Bound the job so a wedged runner cannot block the PR matrix indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # release-plan diff against the PR base
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      # Playwright's own Chromium: the runner's Google Chrome left Studio's
      # message box disabled in the starter smoke (#128).
      - run: npx playwright-core install --with-deps chromium
      - name: Smoke starter
        # Healthy smoke is ~2–4 min; in-process deadline is 15m. Keep Actions
        # above that so the script can report its own abort reason.
        timeout-minutes: 18
        run: node create-agent/scripts/smoke-starter.mjs
      - name: Test dev
        timeout-minutes: 10
        run: npm run test:dev
      - name: Test setup
        timeout-minutes: 10
        run: npm run test:setup
      - name: Validate a proposed release
        if: github.event_name == 'pull_request'
        # release:check is ~2–10 min when healthy; afdaee7 Validate wedged >50 min
        # with no log progress on a frozen runner (cancel was 403 for the bot).
        timeout-minutes: 20
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if ! git diff --quiet "$BASE_SHA" HEAD -- .release/plan.json; then
            # check-example-assets needs the examples build that `check` makes.
            npm run build --prefix examples
            npm run release:check -- --built
          fi
  # WS-H packed-package acceptance (H1–H9) under a temporary Host root.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - run: node scripts/acceptance/tenants.mjs
  # Desktop OSes: J5 desktop contract (installs @nylorun/runtime like a
  # developer, then runs its launcher), launcher unit tests (process groups vs
  # taskkill, .cmd shims) and supervisor tooling. Linux runs all of these in
  # `check` via the workspace tests and test:tooling.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      # Bundled npm is enough: these tests only run npm ci and npm install.
      - run: npm ci
      # Workspaces run in flag order: keep dependency order.
      - run: npm run build --workspace @nylorun/core --workspace @nylorun/harness --workspace @nylorun/agents --workspace @nylorun/admin --workspace @nylorun/runtime
      - name: Desktop contract
        run: node --test scripts/test/desktop-contract.test.mjs
      - name: Launcher unit tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # --retry covers failing tests; a crashed Vitest worker (seen once:
            # exit 0xC0000409 in lifecycle.test.ts) needs a second full run.
            npm test --workspace @nylorun/runtime -- test/launcher --retry=1 ||
              npm test --workspace @nylorun/runtime -- test/launcher --retry=1
          else
            npm test --workspace @nylorun/runtime -- test/launcher
          fi
      - name: Supervisor and release tooling
        run: node --test scripts/test/processes.test.mjs scripts/test/development.test.mjs scripts/test/release.test.mjs scripts/test/version-policy.test.mjs
  # Newest Node line with its bundled npm, as a consumer would run it.
  consumers:
    strategy:
      fail-fast: false
      matrix:
        node: [26.x]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Declared workspace order is dependency order; each check builds its package.
      - run: npm run check --workspaces
  ci:
    if: always()
    needs: [check, smoke, acceptance, desktop, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
