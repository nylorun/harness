name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-check:
    name: ${{ matrix.package }} (${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.14.0", "24.x", "26.x"]
        package: [harness, studio]
        exclude:
          - node: "22.14.0"
            package: studio
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve LF checkout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check --workspace @nylorun/${{ matrix.package }}

  studio-floor:
    name: studio (22.19.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check --workspace @nylorun/studio

  packed-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack the toolchain
        shell: bash
        run: |
          harness="$(npm pack --workspace @nylorun/harness --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          studio="$(npm pack --workspace @nylorun/studio --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          echo "NYLO_HARNESS_SPEC=file:$RUNNER_TEMP/$harness" >> "$GITHUB_ENV"
          echo "NYLO_STUDIO_SPEC=file:$RUNNER_TEMP/$studio" >> "$GITHUB_ENV"
      - name: Install packed public packages
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install "$NYLO_HARNESS_SPEC" "$NYLO_STUDIO_SPEC"

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  verify:
    name: Verify
    if: always()
    needs: [package-check, studio-floor, packed-consumer, audit]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.package-check.result }}" = success && test "${{ needs.studio-floor.result }}" = success && test "${{ needs.packed-consumer.result }}" = success && test "${{ needs.audit.result }}" = success
