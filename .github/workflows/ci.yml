name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    # Bound the job so a wedged runner cannot block the PR matrix indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - run: npm run check -- --built
      - run: npm run check:stack -- --built
      # Worker deployment belongs to the deferred hosting profile.
      - run: npx playwright-core install --with-deps chromium
      - name: Smoke starter
        # Healthy smoke is ~2–4 min; in-process deadline is 15m. Keep Actions
        # above that so the script can report its own abort reason.
        timeout-minutes: 18
        run: node create-agent/scripts/smoke-starter.mjs
      - name: Test dev
        timeout-minutes: 10
        run: npm run test:dev
      - name: Test setup
        timeout-minutes: 10
        run: npm run test:setup
      - name: Validate a proposed release
        if: github.event_name != 'merge_group'
        # release:check is ~2–10 min when healthy; afdaee7 Validate wedged >50 min
        # with no log progress on a frozen runner (cancel was 403 for the bot).
        timeout-minutes: 20
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          git rev-parse --verify --quiet "$BASE_SHA^{commit}" > /dev/null
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- .release/plan.json)
          if [[ -n "$changed" ]]; then
            npm run release:check -- --built
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - run: npm run test:tooling
      - run: node scripts/acceptance/tenants.mjs
  # J5: desktop contract smoke on the three desktop operating systems. It
  # installs @nylorun/runtime like a developer (npm, onto PATH), then runs the
  # launcher up / status / down. Launcher unit tests cover per-OS process
  # handling (process groups vs taskkill, .cmd shims).
  desktop-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run build --workspace @nylorun/core
      - run: npm run build --workspace @nylorun/harness
      - run: npm run build --workspace @nylorun/agents
      - run: npm run build --workspace @nylorun/admin
      - run: npm run build --workspace @nylorun/runtime
      - run: node --test scripts/test/desktop-contract.test.mjs
      - name: Launcher unit tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            npm test --workspace @nylorun/runtime -- test/launcher --retry=1
          else
            npm test --workspace @nylorun/runtime -- test/launcher
          fi
  supervisor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: node --test scripts/test/processes.test.mjs scripts/test/development.test.mjs scripts/test/release.test.mjs scripts/test/version-policy.test.mjs
  consumers:
    strategy:
      fail-fast: false
      matrix:
        node: [24.15.0, 26.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Declared workspace order is dependency order; each check builds its package.
      - run: npm run check --workspaces
  ci:
    if: always()
    needs: [check, test, desktop-contract, supervisor, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DESKTOP_CONTRACT_RESULT: ${{ needs.desktop-contract.result }}
          SUPERVISOR_RESULT: ${{ needs.supervisor.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
        shell: bash
        run: |
          [[ "$CHECK_RESULT" == success ]]
          [[ "$TEST_RESULT" == success ]]
          [[ "$DESKTOP_CONTRACT_RESULT" == success ]]
          [[ "$SUPERVISOR_RESULT" == success ]]
          [[ "$CONSUMERS_RESULT" == success ]]
