name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - run: npm run check -- --built
      - run: npm run check:stack -- --built
      - run: npm run test:dev
      - run: npm run test:setup
      - name: Validate a proposed release
        if: github.event_name != 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          git rev-parse --verify --quiet "$BASE_SHA^{commit}" > /dev/null
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- .release/plan.json)
          if [[ -n "$changed" ]]; then
            npm run release:check -- --built
          fi
  supervisor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: node --test scripts/test/processes.test.mjs scripts/test/development.test.mjs scripts/test/release.test.mjs scripts/test/version-policy.test.mjs
  consumers:
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 22.19.0, 26.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check --workspace @nylorun/harness
      - if: matrix.node != '22.14.0'
        run: npm run check --workspace @nylorun/runtime
      - if: matrix.node != '22.14.0'
        run: npm run check --workspace @nylorun/studio
      - if: matrix.node != '22.14.0'
        run: npm run check --workspace @nylorun/create-agent
  ci:
    if: always()
    needs: [check, supervisor, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SUPERVISOR_RESULT: ${{ needs.supervisor.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
        shell: bash
        run: |
          [[ "$CHECK_RESULT" == success ]]
          [[ "$SUPERVISOR_RESULT" == success ]]
          [[ "$CONSUMERS_RESULT" == success ]]
