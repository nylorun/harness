name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [harness, runtime, create-agent]
        # Every line the published `engines` range admits, so the range is tested rather than
        # asserted: the declared floor, the Active LTS, and the line that becomes LTS in October.
        node: ["22.14.0", "24.x", "26.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      # One workspace install: @nylorun/runtime depends on @nylorun/harness, which is unpublished,
      # so the two only resolve together.
      - run: npm ci
      - run: npm run check --workspace @nylorun/${{ matrix.package }}
        if: matrix.package != 'create-agent'
      - run: npm run check --workspace @nylorun/create-agent
        if: matrix.package == 'create-agent'

  packed-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Deliberately the floor rather than the Active LTS: the lowest supported line is where
          # an integration is most likely to break, and the matrix above covers the rest.
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack the toolchain
        shell: bash
        # Both packages: a generated project installs the runtime, which needs the harness beside it.
        # The filename carries the version, so resolve it rather than pinning it here.
        run: |
          harness="$(cd harness && npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          runtime="$(cd runtime && npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          echo "NYLO_HARNESS_TARBALL=$RUNNER_TEMP/$harness" >> "$GITHUB_ENV"
          echo "NYLO_RUNTIME_SPEC=file:$RUNNER_TEMP/$runtime" >> "$GITHUB_ENV"
      - name: Generate, build, and run consumer
        shell: bash
        run: |
          node create-agent/dist/cli.js "$RUNNER_TEMP/sample-agent" --model openai/gpt-4o --yes
          npm install --prefix "$RUNNER_TEMP/sample-agent" "$NYLO_HARNESS_TARBALL"
          npm run check --prefix "$RUNNER_TEMP/sample-agent"
          npm run build --prefix "$RUNNER_TEMP/sample-agent"

          # Exercise the full run path against a local stub: no key, no outbound network.
          node .github/scripts/sse-stub.mjs > "$RUNNER_TEMP/stub.log" &
          for _ in $(seq 1 50); do grep -q PORT= "$RUNNER_TEMP/stub.log" && break; sleep 0.1; done
          port="$(sed -n 's/^PORT=//p' "$RUNNER_TEMP/stub.log")"
          test -n "$port" || { echo "stub did not start"; exit 1; }

          cd "$RUNNER_TEMP/sample-agent"
          output="$(NYLO_PROVIDER_BASE_URL="http://127.0.0.1:$port/v1" \
            OPENAI_API_KEY=stub npm run dev --silent -- "say hello")"
          echo "$output"
          grep -q "Hello, world." <<<"$output" || { echo "run produced no assistant text"; exit 1; }

  package-manager-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@v2
        if: matrix.package-manager == 'bun'
      - name: Install alternate package managers
        if: matrix.package-manager == 'pnpm' || matrix.package-manager == 'yarn'
        run: npm install --global ${{ matrix.package-manager }}
      - run: npm ci
      - run: npm run build
      - name: Pack the toolchain
        shell: bash
        run: |
          harness="$(cd harness && npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          runtime="$(cd runtime && npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          echo "NYLO_HARNESS_TARBALL=$RUNNER_TEMP/$harness" >> "$GITHUB_ENV"
          echo "NYLO_RUNTIME_SPEC=file:$RUNNER_TEMP/$runtime" >> "$GITHUB_ENV"
      - name: Generate through selected installer
        shell: bash
        run: node create-agent/dist/cli.js "$RUNNER_TEMP/${{ matrix.package-manager }}-agent" --model anthropic/example --yes
        env:
          npm_config_user_agent: ${{ matrix.package-manager }}/test
      - name: Build generated project
        shell: bash
        run: |
          ${{ matrix.package-manager }} add "$NYLO_HARNESS_TARBALL" || ${{ matrix.package-manager }} install "$NYLO_HARNESS_TARBALL"
          ${{ matrix.package-manager }} run build
        working-directory: ${{ runner.temp }}/${{ matrix.package-manager }}-agent

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: npm audit --omit=dev --audit-level=high
