name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the merged release commit on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - name: Validate commit input
        shell: bash
        run: '[[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      # Studio build (via setup) runs pack-ui → dist/bundle.tar + dist/ui-digest.json
      # before check-package / npm pack (Wave 2; deploy-studio is Wave 3 after H1/H2).
      - run: npm run check -- --built
      - run: npx playwright-core install --with-deps chromium
      - run: npm run release:check -- --built
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-packages
          path: .tmp/release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Studio UI hosting artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: studio-ui-bundle
          path: |
            studio/dist/web
            studio/dist/bundle.tar
          if-no-files-found: error
  # D8 / D17: four platform builds on native runners (wiring only — publish consumes).
  # Matches RUNTIME_BUILD_PLATFORMS in scripts/lib/local-build.mjs (no darwin-x64).
  runtime-build:
    if: github.ref == 'refs/heads/main'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run build --workspace @nylorun/core
      - run: npm run build --workspace @nylorun/harness
      - run: npm run build --workspace @nylorun/runtime
      - name: Pack release Runtime build and write index shard
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/release/pack-runtime-build-artifact.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-build-${{ matrix.platform }}
          path: |
            .tmp/release-artifacts/runtime-builds/*.tgz
            .tmp/release-artifacts/runtime-builds/builds-${{ matrix.platform }}.json
          if-no-files-found: error
  publish:
    needs: [validate, runtime-build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-packages
          path: .tmp/release-artifacts/
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: runtime-build-*
          path: .tmp/release-artifacts/runtime-builds-download/
          merge-multiple: true
      - name: Merge Runtime build artifacts (D17 index)
        run: node scripts/release/merge-runtime-build-artifacts.mjs
      - run: node scripts/release/publish.mjs
        env:
          # Optional first-publication fallback; npm prefers configured OIDC trust.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
  # Hosted Studio dashboard → Firebase Hosting (Wave 3 / H1 Firebase).
  # Protected environment `studio`. Pauses (exit 78) until FIREBASE_* secrets exist.
  # Custom domain DNS is Rahul-owned — see docs handoff. No-op does not block npm.
  deploy-studio:
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: studio
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.commit }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'nylorun-oss-studio' }}
      STUDIO_HOSTING_ORIGIN: https://local.nylorun.studio
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          name: studio-ui-bundle
          path: .
      - name: Ensure UI digest exists
        run: |
          test -d studio/dist/web
          test -f studio/dist/bundle.tar
          if [[ ! -f studio/dist/ui-digest.json ]]; then
            npm run build --workspace @nylorun/core
            npm run build --workspace @nylorun/agents
            npm run build --workspace @nylorun/studio
          fi
          test -f studio/dist/ui-digest.json
      # Do not gate on secrets.* in `if` (GitHub rejects it). Always attempt auth;
      # deploy-studio.mjs soft-exits 78 when GOOGLE_APPLICATION_CREDENTIALS / FIREBASE_TOKEN missing.
      - name: Authenticate to Google Cloud (service account)
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Studio UI to Firebase Hosting
        id: deploy
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node studio/scripts/deploy-studio.mjs
      - name: Report deploy outcome
        if: always()
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "Studio hosting deploy succeeded."
            exit 0
          fi
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::Studio Firebase auth unavailable (Environment 'studio' secret missing or invalid)."
            echo "npm publish already completed; retry hosting via Deploy Studio hosting (no npm)."
            exit 0
          fi
          echo "deploy-studio failed while auth succeeded" >&2
          exit 1
