name: Publish npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: npm ci
        working-directory: harness
      - run: npm run check
        working-directory: harness
      - name: Verify release version and choose dist-tag
        id: release
        shell: bash
        run: |
          version="$(node -p \"require('./harness/package.json').version\")"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag"
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public --tag "${{ steps.release.outputs.dist_tag }}"
        working-directory: harness
