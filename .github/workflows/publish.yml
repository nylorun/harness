name: Stage approved npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to stage
        required: true
        type: choice
        options: [harness, create-agent, studio]
      version:
        description: Exact package version to stage
        required: true
        type: string
      dist_tag:
        description: npm dist-tag for this staged release
        required: true
        default: beta
        type: choice
        options: [beta, latest]
      confirm:
        description: Publication has explicit maintainer approval
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    if: inputs.confirm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          # The Active LTS: the compiled output is the same on any supported line, so a release
          # runs on the one still receiving full support rather than on the maintenance floor.
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: npm ci
        working-directory: ${{ inputs.package }}
      - run: npm run check
        working-directory: ${{ inputs.package }}
      - name: Verify version and dist-tag
        working-directory: ${{ inputs.package }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$version" = "${{ inputs.version }}"
          if [[ "$version" == *-* ]]; then
            test "${{ inputs.dist_tag }}" = "beta"
          else
            test "${{ inputs.dist_tag }}" = "latest"
          fi
      - run: npm stage publish --access public --tag "${{ inputs.dist_tag }}"
        working-directory: ${{ inputs.package }}
