name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the merged release commit on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - name: Validate commit input
        shell: bash
        run: '[[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - run: npm run check -- --built
      - run: npm run release:check -- --built
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-packages
          path: .tmp/release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-packages
          path: .tmp/release-artifacts/
      - run: node scripts/release/publish.mjs
        env:
          # Optional first-publication fallback; npm prefers configured OIDC trust.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
