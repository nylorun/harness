name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the merged release commit on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    env:
      RELEASE_SHA: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate commit input
        shell: bash
        run: '[[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      # The merge queue requires `ci` on the exact commit it lands, so every
      # main commit already passed the full suite. Require that instead of
      # re-running it; no check-run means no publication.
      - name: Require merge-queue CI on this commit
        shell: bash
        run: |
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?check_name=ci&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion] | first')
          echo "ci on $RELEASE_SHA: $conclusion"
          [[ "$conclusion" == success ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      # Studio build (via setup) runs pack-ui → dist/bundle.tar + dist/ui-digest.json
      # before npm pack (Wave 2; deploy-studio is Wave 3 after H1/H2).
      # check-example-assets (in release:check) needs the examples build.
      - run: npm run build --prefix examples
      # Headless Chromium only, cached per Playwright version (see ci.yml).
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright-core install --only-shell chromium
      - run: npm run release:check -- --built
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: .tmp/release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
      # Stored relative to studio/dist (the paths' common ancestor).
      - name: Upload Studio UI hosting artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-ui-bundle
          path: |
            studio/dist/web
            studio/dist/bundle.tar
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    # Two registry waits (engines, then creator), each bounded at 10 min.
    timeout-minutes: 40
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: .tmp/release-artifacts/
      - run: node scripts/release/publish.mjs
        env:
          # Optional first-publication fallback; npm prefers configured OIDC trust.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
  # Hosted Studio dashboard → Firebase Hosting (Wave 3 / H1 Firebase).
  # Protected environment `studio`. Pauses (exit 78) until FIREBASE_* secrets exist.
  # Custom domain DNS is Rahul-owned — see docs handoff. No-op does not block npm.
  deploy-studio:
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: studio
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.commit }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'nylorun-oss-studio' }}
      STUDIO_HOSTING_ORIGIN: https://local.nylorun.studio
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      # deploy-studio.mjs uses only Node built-ins and `npx firebase-tools`:
      # no install or build, just the UI that `validate` built and packed.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-ui-bundle
          path: studio/dist
      - run: test -d studio/dist/web && test -f studio/dist/bundle.tar
      # Do not gate on secrets.* in `if` (GitHub rejects it). Always attempt auth;
      # deploy-studio.mjs soft-exits 78 when GOOGLE_APPLICATION_CREDENTIALS / FIREBASE_TOKEN missing.
      - name: Authenticate to Google Cloud (service account)
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Studio UI to Firebase Hosting
        id: deploy
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node studio/scripts/deploy-studio.mjs
      - name: Report deploy outcome
        if: always()
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "Studio hosting deploy succeeded."
            exit 0
          fi
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::Studio Firebase auth unavailable (Environment 'studio' secret missing or invalid)."
            echo "npm publish already completed; retry hosting via Deploy Studio hosting (no npm)."
            exit 0
          fi
          echo "deploy-studio failed while auth succeeded" >&2
          exit 1
