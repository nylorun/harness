name: Publish npm package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options: [harness, studio]
      version:
        description: Exact package version to publish
        required: true
        type: string
      dist_tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options: [beta, latest]
      confirm:
        description: Publication has explicit maintainer approval
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - name: Resolve and verify release
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            package=harness
            expected="${GITHUB_REF_NAME#v}"
          else
            package="${{ inputs.package }}"
            expected="${{ inputs.version }}"
          fi
          actual="$(node -p "require('./' + process.argv[1] + '/package.json').version" "$package")"
          test "$actual" = "$expected"
          if [[ "$actual" == *-* ]]; then
            dist_tag=beta
          else
            dist_tag=latest
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$dist_tag" = "${{ inputs.dist_tag }}"
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - run: npm run check --workspace "@nylorun/${{ steps.release.outputs.package }}"
      - run: npm publish --workspace "@nylorun/${{ steps.release.outputs.package }}" --access public --tag "${{ steps.release.outputs.dist_tag }}"
