name: Prepare package release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Packages to version
        required: true
        default: harness
        type: choice
        options: [harness, studio, both]
      channel:
        description: Release channel (beta accepts major/minor/patch; stable accepts promote)
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      action:
        description: Version action
        required: true
        default: patch
        type: choice
        options: [major, minor, patch, promote]
      dry_run:
        description: Calculate and validate without creating a branch or pull request
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Test release versioning
        run: npm run test:release
      - name: Calculate release versions
        id: release
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          release="$(node .github/scripts/release-version.mjs \
            --scope "$RELEASE_SCOPE" \
            --channel "$RELEASE_CHANNEL" \
            --action "$RELEASE_ACTION")"
          echo "$release"
          echo "plan=$release" >> "$GITHUB_OUTPUT"
          echo "title=$(node -e 'console.log(JSON.parse(process.argv[1]).title)' "$release")" >> "$GITHUB_OUTPUT"
          echo "branch=$(node -e 'console.log(JSON.parse(process.argv[1]).branch)' "$release")" >> "$GITHUB_OUTPUT"
      - name: Update release versions
        if: ${{ !inputs.dry_run }}
        run: |
          node .github/scripts/release-version.mjs \
            --scope "${{ inputs.scope }}" \
            --channel "${{ inputs.channel }}" \
            --action "${{ inputs.action }}" \
            --write
      - name: Verify versions are not published
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: |
          node .github/scripts/release-version.mjs --scope "$RELEASE_SCOPE" --publish --tsv | \
            while IFS=$'\t' read -r _ package version _ _ _; do
              if npm view "$package@$version" version --json > npm-view.out 2> npm-view.err; then
                echo "$package@$version is already published."
                exit 1
              fi
              if ! grep -Eq 'E404|404 Not Found' npm-view.err; then
                cat npm-view.err
                exit 1
              fi
            done
      - name: Check selected packages
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: |
          node .github/scripts/release-version.mjs --scope "$RELEASE_SCOPE" --publish --tsv | \
            while IFS=$'\t' read -r _ package _ _ _ _; do
              npm run check --workspace "$package"
            done
      - name: Verify dry run leaves the checkout unchanged
        if: ${{ inputs.dry_run }}
        run: git diff --exit-code
      - name: Create release pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/release/${{ steps.release.outputs.branch }}
          delete-branch: true
          commit-message: "Release ${{ steps.release.outputs.title }}"
          title: "Release ${{ steps.release.outputs.title }}"
          body: |
            Prepares `${{ inputs.channel }}` publication for `${{ inputs.scope }}`.

            This PR was generated by the **Prepare package release** workflow. Merge it before running **Publish package release** from `main`.
          add-paths: |
            package-lock.json
            harness/package.json
            studio/package.json
