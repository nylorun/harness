# Deploy Studio UI to Firebase Hosting only (no npm publish).
# Used for the first Hosted Studio deploy and for retry after npm already published.
#
# Triggers:
# - workflow_dispatch (once this file is on the default branch)
# - pull_request labeled `deploy-studio` (works from a PR head before merge)
#
# Do not reference secrets.* in job/step `if` — GitHub rejects it. Soft-check
# inside steps; deploy-studio.mjs exits 78 when credentials are missing.
name: Deploy Studio hosting
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy (branch, tag, or full SHA)
        required: true
        type: string
        default: main
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: studio-hosting-deploy
  cancel-in-progress: false
jobs:
  deploy-studio:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy-studio')
    runs-on: ubuntu-latest
    environment: studio
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'nylorun-oss-studio' }}
      STUDIO_HOSTING_ORIGIN: https://local.nylorun.studio
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Build Studio UI + pack-ui
        run: |
          npm run build --workspace @nylorun/core
          npm run build --workspace @nylorun/agents
          npm run build --workspace @nylorun/studio
          test -d studio/dist/web
          test -f studio/dist/bundle.tar
          test -f studio/dist/ui-digest.json
      - name: Authenticate to Google Cloud (service account)
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Studio UI to Firebase Hosting
        id: deploy
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node studio/scripts/deploy-studio.mjs
      - name: Report deploy outcome
        if: always()
        run: |
          REF_LABEL="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}"
          echo "### Studio hosting deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`$REF_LABEL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`${{ env.FIREBASE_PROJECT_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom origin: https://local.nylorun.studio (DNS may still be pending)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fallback: https://${{ env.FIREBASE_PROJECT_ID }}.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth: ${{ steps.auth.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: ${{ steps.deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "Studio hosting deploy succeeded."
            exit 0
          fi
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::Firebase auth unavailable (Environment 'studio' secret missing or invalid)."
            echo "No npm publish was attempted. Fix secrets and re-run."
            exit 0
          fi
          echo "deploy-studio failed while auth succeeded" >&2
          exit 1
