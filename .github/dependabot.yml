version: 2
updates:
  # Group patch/minor bumps so weekly updates do not open N lockfile-overlapping
  # PRs that each re-run full CI after every sibling merge. Majors stay ungrouped
  # for individual review. See .cursor/agents/dependabot-pr-merger.md.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /examples
    schedule:
      interval: weekly
    groups:
      examples-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      examples-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
